aid: remberg
name: Remberg
description: remberg is a Munich-based B2B SaaS provider of an Intelligent Asset Platform for maintenance,
  operations, and service — CMMS/EAM/CAFM software used by industrial companies (Vaillant, Remondis, Liqui
  Moly, SCHUNK, EDEKA, OSRAM) to manage assets, work orders, spare parts, tickets, forms, and preventive
  maintenance, with an AI Copilot and a lightweight execution layer alongside SAP. remberg exposes a public
  REST API (api.remberg.de) across Assets, Work Orders, Work Requests, Tickets, Parts, Organizations,
  Contacts, Users, Files, Forms, Procedures, and AI, with API-key auth, Svix-based webhooks, documented
  rate limits, and ISO 27001 certification.
